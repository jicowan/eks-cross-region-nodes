# Test workload to validate Cluster Autoscaler scales the satellite ASG up.
# Requests 3 CPU per pod × 4 replicas = 12 CPU. m6i.xlarge has 4 CPU, so this needs
# multiple nodes. With max=3 on the ASG, CA will scale up but won't go past 3.
#
# Apply: kubectl apply -f test-scale.yaml
# Cleanup: kubectl delete -f test-scale.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scale-test
  labels:
    app: scale-test
spec:
  replicas: 4
  selector:
    matchLabels:
      app: scale-test
  template:
    metadata:
      labels:
        app: scale-test
    spec:
      nodeSelector:
        eks.amazonaws.com/compute-type: cross-region
      tolerations:
      - operator: Exists
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.10
        resources:
          requests:
            cpu: "3"
            memory: 100Mi
